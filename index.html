<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人生模拟器 - 游戏主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 背景作为纯内容区：无边框，左右布局 -->
        <div class="background-area">
            
            <!-- 左侧：上一年的事情 -->
            <div class="history-panel left-panel">
                <div class="panel-title">【 往岁纪略 】</div>
                <div class="panel-content">
                    <p>景泰二年 春：你大病初愈，身体虚弱，整日卧床休养。</p>
                    <p>景泰二年 夏：邻里逢旱，田地颗粒无收。你随父母变卖了家产，前往京郊逃荒。</p>
                    <p>景泰二年 秋：在城外遇贵人施粥，勉强渡过难关，你的心境发生了些许变化。</p>
                    <p>景泰二年 冬：大雪封山，你在破庙中听闻朝廷要征兵，心中隐隐不安。</p>
                </div>
            </div>

            <!-- 中间渐变分割线 -->
            <div class="divider"></div>

            <!-- 右侧：下一年的事情 / 当前推演 -->
            <div class="history-panel right-panel">
                <div class="panel-title">【 今岁推演 】</div>
                <div class="panel-content">
                    <p>景泰三年 春：新的一年开始了。你决定前往城里的私塾外偷听讲学，渴望改变命运。</p>
                    <p class="fade-text">岁月流转，前方迷雾重重，诸事尚未落定...</p>
                </div>
            </div>

        </div>

        <!-- UI 交互层 -->
        <div class="ui-layer">
            
            <!-- 顶部左侧：角色身份与年龄 -->
            <div class="top-left">
                <div class="player-avatar">头像</div>
                <div class="player-info">
                    <div class="player-name">平民_张三</div>
                    <div class="player-level">18 岁</div>
                </div>
            </div>

            <!-- 顶部右侧：生存资源与辅助系统 -->
            <div class="top-right">
                <div class="resources-wrapper">
                    <div class="resource-item">
                        <span class="res-icon">健康</span>
                        <span class="res-value">100/100</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">金钱</span>
                        <span class="res-value">5000</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">心情</span>
                        <span class="res-value">85</span>
                    </div>
                </div>
                <div class="system-btns">
                    <div class="icon-btn">信件</div>
                    <div class="icon-btn">背包</div>
                </div>
            </div>

            <!-- 左侧边栏：核心功能 -->
            <div class="left-sidebar">
                <div class="icon-btn">人际</div>
                <div class="icon-btn">地图</div>
                <div class="icon-btn">我</div>
                <div class="icon-btn">任务</div>
            </div>

            <!-- 右侧主菜单：收纳菜单 -->
            <div class="right-menu">
                <div class="main-btn">设置</div>
                <div class="main-btn">微调</div>
                <div class="main-btn">存档</div>
                <div class="main-btn">读档</div>
                <div class="main-btn">重生</div>
            </div>

            <!-- 底部栏：下一年长条按钮 -->
            <div class="bottom-left">
                <div class="icon-btn">日志</div>
                <div class="long-btn">下一年</div>
            </div>

            <!-- 右下角：收纳开关 -->
            <div class="bottom-right">
                <div class="huge-btn" id="toggle-menu-btn">展开</div>
            </div>

        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
