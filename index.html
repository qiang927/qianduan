<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover 适配手机刘海屏，禁止用户缩放页面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>以闪耀之名 - 主页布局</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 3D 人物/背景区 (占位) -->
        <div class="background-area">
            <h1>🌸 3D人物展示区 🌸</h1>
        </div>

        <!-- UI 交互层 -->
        <div class="ui-layer">
            
            <!-- 顶部左侧：玩家信息 -->
            <div class="top-left">
                <div class="player-avatar">头像</div>
                <div class="player-info">
                    <div class="player-name">搭配师_小明</div>
                    <div class="player-level">Lv. 30</div>
                </div>
            </div>

            <!-- 顶部右侧：资源与系统 -->
            <div class="top-right">
                <div class="resources-wrapper">
                    <div class="resource-item">
                        <span class="res-icon">体力</span>
                        <span class="res-value">120</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">金币</span>
                        <span class="res-value">5万</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">钻石</span>
                        <span class="res-value">1200</span>
                    </div>
                </div>
                <div class="system-btns">
                    <div class="icon-btn">邮件</div>
                    <div class="icon-btn">设置</div>
                </div>
            </div>

            <!-- 左侧边栏：活动与福利 -->
            <div class="left-sidebar">
                <div class="icon-btn">福利</div>
                <div class="icon-btn">签到</div>
                <div class="icon-btn">首充</div>
                <div class="icon-btn">任务</div>
            </div>

            <!-- 右侧主菜单：主要功能入口 -->
            <div class="right-menu">
                <div class="main-btn">衣橱</div>
                <div class="main-btn">追光</div>
                <div class="main-btn">家园</div>
                <div class="main-btn">设计室</div>
                <div class="main-btn">协会</div>
            </div>

            <!-- 底部栏：聊天与社交 -->
            <div class="bottom-left">
                <div class="icon-btn">好友</div>
                <div class="chat-box">世界：有没有人一起玩家园？</div>
            </div>

            <!-- 右下角：主线关卡 -->
            <div class="bottom-right">
                <div class="huge-btn">主线之旅</div>
            </div>

        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
