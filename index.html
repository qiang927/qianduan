<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人生模拟器 - 游戏主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 场景/文字沙盒世界展示区 (占位) -->
        <div class="background-area">
            <h1>🌍 现代/古代世界模拟进行中... 🌍</h1>
        </div>

        <!-- UI 交互层 -->
        <div class="ui-layer">
            
            <!-- 顶部左侧：角色身份与年龄 -->
            <div class="top-left">
                <div class="player-avatar">头像</div>
                <div class="player-info">
                    <div class="player-name">平民_张三</div>
                    <div class="player-level">18 岁</div>
                </div>
            </div>

            <!-- 顶部右侧：生存资源与辅助系统 -->
            <div class="top-right">
                <div class="resources-wrapper">
                    <div class="resource-item">
                        <span class="res-icon">健康</span>
                        <span class="res-value">100/100</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">金钱</span>
                        <span class="res-value">5000</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">心情</span>
                        <span class="res-value">85</span>
                    </div>
                </div>
                <div class="system-btns">
                    <div class="icon-btn">信件</div>
                    <div class="icon-btn">背包</div>
                </div>
            </div>

            <!-- 左侧边栏：核心功能 -->
            <div class="left-sidebar">
                <div class="icon-btn">人际</div>
                <div class="icon-btn">地图</div>
                <div class="icon-btn">我</div>
                <div class="icon-btn">任务</div>
            </div>

            <!-- 右侧主菜单：收纳菜单 -->
            <div class="right-menu">
                <div class="main-btn">设置</div>
                <div class="main-btn">微调</div>
                <div class="main-btn">存档</div>
                <div class="main-btn">读档</div>
                <div class="main-btn">重生</div>
            </div>

            <!-- 底部栏：人生轨迹与事件日志 -->
            <div class="bottom-left">
                <div class="icon-btn">日志</div>
                <div class="chat-box">系统：新的一年开始了，你感觉精力充沛。</div>
            </div>

            <!-- 右下角：时间推进 -->
            <div class="bottom-right">
                <div class="huge-btn">下一年</div>
            </div>

        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
