<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>人生模拟器 - 游戏主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 背景布局：参考《长公主的日常》行程安排界面 -->
        <div class="background-area">
            <div class="schedule-board">
                <div class="schedule-header">
                    <span class="sh-title">【 本月行程安排 】</span>
                    <span class="sh-subtitle">景泰三年 春</span>
                </div>
                <div class="schedule-content">
                    <div class="time-slot">
                        <span class="time-label">清晨</span>
                        <div class="action-box">去往 私塾 读书</div>
                    </div>
                    <div class="time-slot">
                        <span class="time-label">午后</span>
                        <div class="action-box">拜访 张府</div>
                    </div>
                    <div class="time-slot">
                        <span class="time-label">傍晚</span>
                        <div class="action-box empty-box">点击安排行程...</div>
                    </div>
                    <div class="time-slot">
                        <span class="time-label">深夜</span>
                        <div class="action-box empty-box">就寝休息...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- UI 交互层 -->
        <div class="ui-layer">
            
            <!-- 顶部左侧：角色身份与年龄 -->
            <div class="top-left">
                <div class="player-avatar">头像</div>
                <div class="player-info">
                    <div class="player-name">平民_张三</div>
                    <div class="player-level">18 岁</div>
                </div>
            </div>

            <!-- 顶部右侧：生存资源与辅助系统 -->
            <div class="top-right">
                <div class="resources-wrapper">
                    <div class="resource-item">
                        <span class="res-icon">健康</span>
                        <span class="res-value">100/100</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">金钱</span>
                        <span class="res-value">5000</span>
                    </div>
                    <div class="resource-item">
                        <span class="res-icon">心情</span>
                        <span class="res-value">85</span>
                    </div>
                </div>
                <div class="system-btns">
                    <div class="icon-btn">信件</div>
                    <div class="icon-btn">背包</div>
                </div>
            </div>

            <!-- 左侧边栏：核心功能 -->
            <div class="left-sidebar">
                <div class="icon-btn">人际</div>
                <div class="icon-btn">地图</div>
                <div class="icon-btn">我</div>
                <div class="icon-btn">任务</div>
            </div>

            <!-- 右侧主菜单：收纳菜单 -->
            <div class="right-menu">
                <div class="main-btn">设置</div>
                <div class="main-btn">微调</div>
                <div class="main-btn">存档</div>
                <div class="main-btn">读档</div>
                <div class="main-btn">重生</div>
            </div>

            <!-- 底部栏：原来是系统日志，现改为下一年长条按钮 -->
            <div class="bottom-left">
                <div class="icon-btn">日志</div>
                <div class="long-btn">下一年</div>
            </div>

            <!-- 右下角：收纳开关 -->
            <div class="bottom-right">
                <div class="huge-btn" id="toggle-menu-btn">展开</div>
            </div>

        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
